<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f1422"/>
      <stop offset="100%" stop-color="#080a10"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#192236"/>
      <stop offset="100%" stop-color="#121827"/>
    </linearGradient>

    <!-- Glow & Border Gradients -->
    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#06b6d4" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#8b5cf6" />
    </marker>
    <marker id="arrowEmerald" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#10b981" />
    </marker>
  </defs>

  <style>
    .title-main { font-family: 'Segoe UI', Inter, sans-serif; font-size: 28px; font-weight: 800; fill: #ffffff; letter-spacing: 0.5px; }
    .subtitle { font-family: 'Segoe UI', Inter, sans-serif; font-size: 14px; fill: #94a3b8; font-weight: 400; }
    .tier-badge { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #38bdf8; letter-spacing: 1.5px; text-transform: uppercase; }
    .card-title { font-family: 'Segoe UI', Inter, sans-serif; font-size: 17px; font-weight: 700; fill: #f8fafc; }
    .card-subtitle { font-family: 'Segoe UI', Inter, sans-serif; font-size: 12px; fill: #94a3b8; }
    .body-text { font-family: 'Segoe UI', Inter, sans-serif; font-size: 12px; fill: #cbd5e1; line-height: 1.5; }
    .code-text { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; fill: #38bdf8; }
    .stat-badge { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10px; font-weight: 600; fill: #a855f7; }
  </style>

  <!-- Canvas Background -->
  <rect width="1600" height="1000" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Grid -->
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.15">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="40" y2="0" />
      <line x1="0" y1="0" x2="0" y2="40" />
    </pattern>
    <rect width="1600" height="1000" fill="url(#grid)" />
  </g>

  <!-- ==========================================
       HEADER SECTION
       ========================================== -->
  <g transform="translate(80, 50)">
    <rect x="-10" y="-10" width="1440" height="70" rx="14" fill="#0f172a" fill-opacity="0.6" stroke="#1e293b" stroke-width="1"/>
    <circle cx="25" cy="25" r="14" fill="url(#cyanPurpleGrad)"/>
    <path d="M 21 21 L 29 25 L 21 29 Z" fill="#ffffff"/>
    <text x="50" y="24" class="title-main">System Architecture &amp; Execution Workflow</text>
    <text x="50" y="44" class="subtitle">Classical Cryptography Suite, Automated Cryptanalysis Engine &amp; REST Services</text>
    <rect x="1240" y="14" width="170" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="1325" y="31" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">FastAPI • Python 3.14</text>
  </g>

  <!-- ==========================================
       TIER 1: CLIENT & PRESENTATION LAYER
       ========================================== -->
  <g transform="translate(80, 160)">
    <!-- Container Box -->
    <rect width="1440" height="150" rx="16" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />
    <text x="25" y="28" class="tier-badge">Layer 01 — Presentation &amp; Client Access</text>

    <!-- Card 1: Web Dashboard UI -->
    <g transform="translate(25, 45)" filter="url(#cardShadow)">
      <rect width="680" height="85" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="85" rx="2" fill="#06b6d4" />
      <text x="24" y="28" class="card-title">Interactive Single-Page Application (SPA)</text>
      <text x="24" y="48" class="card-subtitle">Modern Dark/Light UI • Tailwind CSS Design System • Chart.js Real-Time Histogram</text>
      <text x="24" y="68" class="code-text">4 Tab Panels: [1] Caesar Playground  [2] Smart Cracker  [3] Multi-Cipher  [4] File Processor</text>
    </g>

    <!-- Card 2: Terminal CLI -->
    <g transform="translate(735, 45)" filter="url(#cardShadow)">
      <rect width="680" height="85" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="85" rx="2" fill="#8b5cf6" />
      <text x="24" y="28" class="card-title">Standalone CLI Utility Tool</text>
      <text x="24" y="48" class="card-subtitle">scripts/caesar_cli.py • Interactive terminal loop • Zero-dependency execution</text>
      <text x="24" y="68" class="code-text">Direct terminal operations: Modular shift, Decrypt, and Full 25-Shift Brute-force</text>
    </g>
  </g>

  <!-- FLOW ARROWS TIER 1 -> TIER 2 -->
  <g stroke="#06b6d4" stroke-width="2" stroke-dasharray="6,4">
    <path d="M 445 310 L 445 350 L 760 350 L 760 375" fill="none" marker-end="url(#arrowCyan)" />
    <path d="M 1155 310 L 1155 350 L 840 350 L 840 375" fill="none" marker-end="url(#arrowPurple)" stroke="#8b5cf6" />
  </g>

  <!-- ==========================================
       TIER 2: API GATEWAY & ROUTING LAYER
       ========================================== -->
  <g transform="translate(80, 380)">
    <rect width="1440" height="120" rx="16" fill="#0b1120" stroke="#1e293b" stroke-width="1.5"/>
    <text x="25" y="28" class="tier-badge">Layer 02 — API Gateway &amp; Validation (FastAPI + Pydantic)</text>

    <g transform="translate(25, 45)" filter="url(#cardShadow)">
      <rect width="1390" height="58" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="25" class="card-title">FastAPI High-Performance Async REST Gateway</text>
      <text x="20" y="44" class="code-text">CORS Middleware • Pydantic Schema Contracts • Auto-generated OpenAPI /docs • Multipart File Handlers</text>

      <rect x="980" y="14" width="390" height="30" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="995" y="33" class="code-text">POST /encrypt • /decrypt • /brute-force • /files</text>
    </g>
  </g>

  <!-- FLOW ARROWS TIER 2 -> TIER 3 -->
  <g stroke="#38bdf8" stroke-width="2">
    <path d="M 320 500 L 320 545" fill="none" marker-end="url(#arrowCyan)" />
    <path d="M 800 500 L 800 545" fill="none" marker-end="url(#arrowPurple)" stroke="#8b5cf6" />
    <path d="M 1280 500 L 1280 545" fill="none" marker-end="url(#arrowEmerald)" stroke="#10b981" />
  </g>

  <!-- ==========================================
       TIER 3: CORE PROCESSING ENGINES
       ========================================== -->
  <g transform="translate(80, 550)">
    <rect width="1440" height="230" rx="16" fill="#0b1120" stroke="#1e293b" stroke-width="1.5"/>
    <text x="25" y="28" class="tier-badge">Layer 03 — Cryptographic Kernels &amp; Analytical Subsystems</text>

    <!-- Engine 1: Classical Ciphers -->
    <g transform="translate(25, 45)" filter="url(#cardShadow)">
      <rect width="445" height="165" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2"/>
      <rect x="0" y="0" width="4" height="165" rx="2" fill="#06b6d4" />
      <text x="20" y="26" class="card-title">Classical Cipher Engine</text>
      <text x="20" y="44" class="stat-badge">app/crypto/caesar.py &amp; ciphers.py</text>
      
      <g transform="translate(20, 60)" class="body-text">
        <text x="0" y="15">• Caesar Cipher: C = (P + k) mod 26</text>
        <text x="0" y="35">• Vigenère Cipher: Polyalphabetic stream</text>
        <text x="0" y="55">• Atbash Inversion: Symmetrical A ↔ Z</text>
        <text x="0" y="75">• ROT13: Caesar 13-shift self-inverse</text>
        <text x="0" y="95">• Unicode &amp; symbol preservation</text>
      </g>
    </g>

    <!-- Engine 2: Cryptanalysis Engine -->
    <g transform="translate(495, 45)" filter="url(#cardShadow)">
      <rect width="450" height="165" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2"/>
      <rect x="0" y="0" width="4" height="165" rx="2" fill="#8b5cf6" />
      <text x="20" y="26" class="card-title">Automated Cryptanalysis Engine</text>
      <text x="20" y="44" class="stat-badge">app/crypto/caesar.py (Chi-Squared)</text>
      
      <g transform="translate(20, 60)" class="body-text">
        <text x="0" y="15">• 25 Permutation Brute-Force Generator</text>
        <text x="0" y="35">• Chi-Squared Goodness-of-Fit Test (χ²)</text>
        <text x="0" y="55">• Standard English ETAOIN distribution</text>
        <text x="0" y="75">• Common English lexicon matching bonus</text>
        <text x="0" y="95">• Confidence scoring: High / Med / Low</text>
      </g>
    </g>

    <!-- Engine 3: File Processor Engine -->
    <g transform="translate(970, 45)" filter="url(#cardShadow)">
      <rect width="445" height="165" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2"/>
      <rect x="0" y="0" width="4" height="165" rx="2" fill="#10b981" />
      <text x="20" y="26" class="card-title">Stream File Processing Engine</text>
      <text x="20" y="44" class="stat-badge">app/main.py (process_file)</text>
      
      <g transform="translate(20, 60)" class="body-text">
        <text x="0" y="15">• Binary multipart/form stream upload</text>
        <text x="0" y="35">• UTF-8 safe decoding with replacement</text>
        <text x="0" y="55">• In-memory transformation buffer</text>
        <text x="0" y="75">• Path-sanitized filename preservation</text>
        <text x="0" y="95">• Auto-triggered browser file download</text>
      </g>
    </g>
  </g>

  <!-- FLOW ARROWS TIER 3 -> TIER 4 -->
  <g stroke="#64748b" stroke-width="2">
    <path d="M 245 780 L 245 815" fill="none" marker-end="url(#arrowCyan)" stroke="#06b6d4" />
    <path d="M 720 780 L 720 815" fill="none" marker-end="url(#arrowPurple)" stroke="#8b5cf6" />
    <path d="M 1195 780 L 1195 815" fill="none" marker-end="url(#arrowEmerald)" stroke="#10b981" />
  </g>

  <!-- ==========================================
       TIER 4: RESPONSE & OUTPUT LAYER
       ========================================== -->
  <g transform="translate(80, 820)">
    <rect width="1440" height="130" rx="16" fill="#0b1120" stroke="#1e293b" stroke-width="1.5"/>
    <text x="25" y="26" class="tier-badge">Layer 04 — Visualization, Telemetry &amp; Artifact Delivery</text>

    <g transform="translate(25, 40)">
      <!-- Output 1 -->
      <rect x="0" y="0" width="445" height="75" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="26" class="card-title">Real-Time Frequency Chart</text>
      <text x="20" y="45" class="card-subtitle">Live dual-series comparative bar chart</text>
      <text x="20" y="62" class="code-text">Observed Text % vs. Standard ETAOIN</text>

      <!-- Output 2 -->
      <rect x="470" y="0" width="450" height="75" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="490" y="26" class="card-title">Ranked Decryption Candidates</text>
      <text x="490" y="45" class="card-subtitle">All 25 shifts sorted by ascending χ² score</text>
      <text x="490" y="62" class="code-text">Top-rank detection &amp; 1-click workspace load</text>

      <!-- Output 3 -->
      <rect x="945" y="0" width="445" height="75" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="965" y="26" class="card-title">Processed Document Download</text>
      <text x="965" y="45" class="card-subtitle">Streamed PlainText attachment response</text>
      <text x="965" y="62" class="code-text">processed_{filename}.txt downloaded</text>
    </g>
  </g>
</svg>
